[project]
name = "qnx-docs-mcp"
version = "0.1.0"
description = "MCP server for searching and reading the public QNX documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[dependency-groups]
dev = ["pylint>=3"]

[tool.uv]
package = false
